name: CI/CD Préproduction

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v3

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔨 Compiler l'application
        run: ./mvnw package -DskipTests

      - name: ✅ Vérifier le build
        run: |
          echo "Build terminé avec succès !"
          ls -la target/*.jar

      - name: 🐳 Construire l'image Docker
        run: docker build -t petclinic-preprod:latest .

      - name: 🚀 Démarrer l'environnement de préproduction
        run: docker compose -f docker-compose.preprod.yml up -d

      - name: 🏥 Vérifier que l'app répond
        run: |
          sleep 30
          curl --fail http://localhost:8081 || exit 1